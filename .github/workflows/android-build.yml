name: Build Android APK

# Builds a debug .apk of the Retirement Super Timeline app on Linux
# (Buildozer cannot run on Windows/macOS).
#
# The toolchain is PINNED on purpose: buildozer 1.5.0 +
# python-for-android 2024.1.21, plus `python3==3.11.9` in buildozer.spec.
# A newer python-for-android builds against CPython 3.13/3.14, where
# Kivy 2.3.0's C extensions fail to compile ("Py_UNICODE is deprecated" /
# "_PyLong_AsByteArray ... expected 6, have 5").
#
# Download the finished APK from the run's "Artifacts" section.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config cmake patchelf \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install pinned Buildozer toolchain
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall "buildozer==1.5.0" \
            "python-for-android==2024.1.21" "cython<3.1" "setuptools<74" wheel
          buildozer --version
          pip show python-for-android | grep -E '^Version: 2024\.1\.21$'

      - name: Cache Android SDK/NDK downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-sdk-

      - name: Build debug APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # never reuse a half-built target from a previous/cached run
          rm -rf .buildozer/android/platform/build-* \
                 .buildozer/android/platform/dists \
                 .buildozer/android/platform/dist
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: retirement-timeline-apk
          path: bin/*.apk
          if-no-files-found: error
